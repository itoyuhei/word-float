const $=id=>document.getElementById(id),stage=$('stage'),controls=['speed','duration','size','density','wiki','recent','slang','trends','custom'];let pool=[...new Set(seed)],timer=null,paused=false,last='',loading=false;let prefs={};try{prefs=JSON.parse(localStorage.getItem('wordFloatPrefs')||'{}')}catch{};for(const id of controls){if(prefs[id]!==undefined)$(id)[['wiki','recent','slang','trends'].includes(id)?'checked':'value']=prefs[id];$(id).addEventListener(id==='custom'?'input':'change',()=>{save();labels();if(id==='speed')start()})}function save(){const p={};for(const id of controls)p[id]=$(id)[['wiki','recent','slang','trends'].includes(id)?'checked':'value'];localStorage.setItem('wordFloatPrefs',JSON.stringify(p))}function labels(){$('speedVal').textContent=($('speed').value/1000).toFixed(1)+'秒';$('durationVal').textContent=($('duration').value/1000).toFixed(1)+'秒';$('sizeVal').textContent=$('size').value+'px';$('densityVal').textContent=$('density').value}labels();function random(a,b){return a+Math.random()*(b-a)}function words(){return [...pool,...($('slang').checked?slangWords:[]),...$('custom').value.split(/[\n,、，]+/).map(x=>x.trim()).filter(Boolean)]}function spawn(){if(paused||stage.childElementCount>=Number($('density').value))return;const list=words();if(!list.length)return;let w=list[Math.floor(Math.random()*list.length)];if(list.length>1&&w===last)w=list[(list.indexOf(w)+1)%list.length];last=w;const el=document.createElement('span');el.className='word';el.textContent=w;const max=Number($('size').value),font=Math.round(random(Math.max(13,max*.52),max*1.3));el.style.fontSize=font+'px';el.style.setProperty('--dur',$('duration').value+'ms');el.style.setProperty('--alpha',random(.48,.94).toFixed(2));el.style.color=Math.random()<.18?'#a8c3ee':'#e8edf7';stage.appendChild(el);const width=el.getBoundingClientRect().width;el.style.left=Math.round(random(10,Math.max(11,innerWidth-width-10)))+'px';el.style.top=Math.round(random(65,Math.max(66,innerHeight-font-3 function cleanTerms(items){return items.filter(x=>typeof x==='string').map(x=>x.trim()).filter(x=>x.length>=2&&x.length<=26&&!/^[0-9\s\W]+$/.test(x)&&!x.includes('一覧')&&!x.includes('曖昧さ回避'))}
async function wikiApi(params){const url='https://ja.wikipedia.org/w/api.php?'+new URLSearchParams({...params,format:'json',origin:'*'});const r=await fetch(url,{signal:AbortSignal.timeout(12000),cache:'no-store'});if(!r.ok)throw Error('wiki '+r.status);return r.json()}
async function loadAll(){if(loading)return;loading=true;const updates=[];const tasks=[];$('status').textContent='新しい単語を取得中…';
if($('wiki').checked)tasks.push(wikiApi({action:'query',generator:'random',grnnamespace:'0',grnlimit:'40',prop:'info'}).then(d=>{const names=cleanTerms(Object.values(d.query?.pages||{}).map(p=>p.title));pool=[...new Set([...pool,...names])];updates.push('ランダム '+names.length)}));
if($('recent').checked)tasks.push(wikiApi({action:'query',list:'recentchanges',rctype:'new',rcnamespace:'0',rclimit:'100',rcprop:'title'}).then(d=>{const names=cleanTerms((d.query?.recentchanges||[]).map(p=>p.title));pool=[...new Set([...pool,...names])];updates.push('新着記事 '+names.length)}));
if($('trends').checked)tasks.push(fetch('./trends.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('trend file');return r.json()}).then(d=>{const names=cleanTerms(d.words||[]);pool=[...new Set([...pool,...names])];updates.push('トレンド '+names.length)}));
const results=await Promise.allSettled(tasks);const failed=results.filter(r=>r.status==='rejected').length;$('status').textContent=(updates.join(' / ')||'内蔵単語を使用')+'｜合計 '+words().length+'語'+(failed?'（'+failed+'件取得できず）':'');loading=false;}
$('refresh').onclick=loadAll;loadAll();setInterval(()=>{if(!paused)loadAll()},10*60*1000);
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
